<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FIFA World Cup 2026 Prediction Standings</title>
  <style>
    @page { size: A4 landscape; margin: 0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #06120d; color: #f4fff8; font-family: Arial, Helvetica, sans-serif; }
    .poster {
      width: 1600px; height: 1131px; margin: auto; padding: 42px 48px 34px;
      background:
        radial-gradient(circle at 50% -10%, rgba(49,211,139,.25), transparent 40%),
        linear-gradient(135deg, #071812, #0b241a 55%, #071812);
      position: relative; overflow: hidden;
    }
    .poster::before {
      content: ""; position: absolute; inset: 0; opacity: .06;
      background-image: repeating-linear-gradient(90deg, transparent 0 98px, #fff 99px 100px);
    }
    header { position: relative; display: flex; justify-content: space-between; align-items: end; border-bottom: 2px solid #28d58e; padding-bottom: 20px; }
    h1 { margin: 0; font-size: 42px; letter-spacing: .5px; }
    h1 span { color: #35e6a0; }
    .subtitle { margin-top: 7px; color: #9fc8b6; font-size: 17px; }
    .ball { font-size: 66px; filter: drop-shadow(0 0 18px rgba(53,230,160,.35)); }
    .tables { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 25px; }
    table { width: 100%; border-collapse: collapse; background: rgba(3,14,10,.72); border: 1px solid rgba(53,230,160,.25); }
    thead { background: #123c2c; color: #aef3d1; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .7px; padding: 9px 8px; }
    td { font-size: 13px; padding: 7px 8px; border-top: 1px solid rgba(255,255,255,.075); }
    tbody tr:nth-child(even) { background: rgba(255,255,255,.035); }
    tbody tr.top3 { background: rgba(255,193,7,.11); }
    .rank { width: 42px; text-align: center; font-weight: 800; color: #72e8b5; }
    .name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
    .num { text-align: right; font-variant-numeric: tabular-nums; color: #c5d9cf; }
    .scorer { color: #ffc857; }
    .total { color: #45eda8; font-weight: 900; font-size: 14px; }
    footer { position: absolute; bottom: 19px; left: 48px; right: 48px; display: flex; justify-content: space-between; color: #789b8c; font-size: 12px; }
    .legend b { color: #bfe9d6; }
    @media print {
      body { background: none; }
      .poster { width: 297mm; height: 210mm; padding: 8mm 9mm 6mm; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      h1 { font-size: 27px; } .ball { font-size: 42px; }
      .tables { gap: 5mm; margin-top: 4mm; }
      th { padding: 4px; font-size: 7px; } td { padding: 3.2px 4px; font-size: 7.5px; }
      .total { font-size: 8px; } footer { left: 9mm; right: 9mm; bottom: 4mm; font-size: 7px; }
    }
  </style>
</head>
<body>
  <main class="poster">
    <header>

        <h1>FIFA WORLD CUP 2026 <span>PREDICTION STANDINGS</span></h1>
        <div class="subtitle">Match predictions + Group Stage standings + Group Stage Top Scorer</div>
      </div>
      <div class="ball">⚽</div>
    </header>
    <section class="tables" id="tables"></section>
    <footer>
      <div class="legend"><b>Match</b> includes match extras · <b>Group</b> includes 12 group-table predictions · <b>Top Scorer</b> = 75 points</div>
      <div>Updated 28 June 2026</div>
    </footer>
  </main>

    function makeTable(rows, offset) {
      const table = document.createElement("table");
      table.innerHTML = `<thead><tr><th>#</th><th style="text-align:left">Player</th><th>Match</th><th>Group</th><th>Top Scorer</th><th>Total</th></tr></thead>
        <tbody>${rows.map((p,i) => {
          const rank = offset + i + 1;
          return `<tr class="${rank <= 3 ? "top3" : ""}"><td class="rank">${rank}</td><td class="name">${p[0]}</td><td class="num">${p[1]}</td><td class="num">${p[2]}</td><td class="num scorer">${p[3]}</td><td class="num total">${p[4]}</td></tr>`;
        }).join("")}</tbody>`;
      return table;
    }
    const split = Math.ceil(players.length / 2);
    document.getElementById("tables").append(makeTable(players.slice(0, split), 0), makeTable(players.slice(split), split));
  </script>
</body>
</html>
