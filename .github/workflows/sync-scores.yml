name: Auto Sync Scores

on:
  schedule:
    # Run every 10 minutes only during match hours (UTC)
    # WC matches are typically 00:00-23:00 UTC, but most are clustered
    # Run from 12:00 UTC to 05:00 UTC next day (5:30 PM IST to 10:30 AM IST)
    # which covers all match windows with buffer
    - cron: '*/10 0-5,12-23 * 6-7 *'
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync-scores API
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://www.slgevents.in/api/sync-scores" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d '{}')
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          
          echo "Status: $HTTP_CODE"
          echo "Response: $BODY"
          
          # Don't fail on skipped (no matches in window)
          if [ "$HTTP_CODE" -ge 500 ]; then
            echo "Sync failed with status $HTTP_CODE"
            exit 1
          fi
