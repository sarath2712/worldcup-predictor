name: Update Top Scorers

on:
  schedule:
    # Run daily at 11:00 AM IST = 5:30 AM UTC
    - cron: '30 5 * 6-7 *'
  workflow_dispatch:
    inputs:
      scorers_json:
        description: 'JSON array of scorers: [{"rank":1,"player_name":"...","team":"...","goals":3,"assists":1}]'
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update top scorers
        run: |
          # Use manual input if provided, otherwise use a placeholder
          if [ -n "${{ github.event.inputs.scorers_json }}" ]; then
            SCORERS='${{ github.event.inputs.scorers_json }}'
          else
            echo "No scorers data provided for scheduled run. Skipping."
            echo "Use workflow_dispatch with scorers_json input to update."
            exit 0
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://www.slgevents.in/api/top-scorers" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -d "{\"scorers\": $SCORERS}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "Status: $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Update failed with status $HTTP_CODE"
            exit 1
          fi
